version: 1
description: |
  Canonical single-pass restructure of Keywords_summarized_new.csv. Every rule below
  carries a one-line rationale comment. The script is applied to the original source CSV
  and produces the cleaned tree in one pass; intermediate cleanup_v1..v4 drafts are
  deliberately absent — they are now git history.

rules:


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE A — Misclassified leaves → correct subtree
  # ════════════════════════════════════════════════════════════════════════════

  # G80 is a neurological condition, not a birth outcome.
  - id: promote_cerebral_palsy
    promote:
      select:
        name: Cerebral palsy
      to: Diseases of the nervous system (G00-G99)

  # Cotinine is a biomarker, not a 'chemical exposure' class; first hop out of Chemicals.
  - id: promote_cotinine
    promote:
      select:
        name: Cotinine
      to: (Molecular) biomarkers

  # Creatinine is a biomarker, not a chemical; first hop out of Chemicals.
  - id: promote_creatinine
    promote:
      select:
        name: Creatinine
      to: (Molecular) biomarkers


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE B — Dedup merges (two naming conventions → one concept)
  # ════════════════════════════════════════════════════════════════════════════

  # 'Birth outcome' (singular) is a dup of the real 'Birth outcomes' subtree.
  - id: dedup_birth_outcome
    reroute:
      select:
        name: Birth outcome
      to: Birth outcomes
      keep_as_keyword: true

  # Food_IgE and IgE (Food) are the same concept in two dialect imports.
  - id: merge_food_ige
    merge:
      select:
        any:
        - name: Food_IgE
        - name: IgE (Food)
      as: Food allergen sensitization (IgE)

  # Food_Skin prick test and Skin prick test (Food) — same dialect dup.
  - id: merge_food_spt
    merge:
      select:
        any:
        - name: Food_Skin prick test
        - name: Skin prick test (Food)
      as: Food allergen sensitization (Skin prick test)

  # Inhalant_IgE and IgE (Inhalant) — same dialect dup.
  - id: merge_inhalant_ige
    merge:
      select:
        any:
        - name: Inhalant_IgE
        - name: IgE (Inhalant)
      as: Inhalant allergen sensitization (IgE)

  # Inhalant_Skin prick test and Skin prick test (Inhalant) — same dialect dup.
  - id: merge_inhalant_spt
    merge:
      select:
        any:
        - name: Inhalant_Skin prick test
        - name: Skin prick test (Inhalant)
      as: Inhalant allergen sensitization (Skin prick test)

  # Per-allergen dup 'IgE - Any food allergic sensitization' vs 'Any food ... (IgE)'.
  - id: merge_food_any_ige
    merge:
      select:
        any:
        - name: IgE - Any food allergic sensitization
        - name: Any food allergic sensitization (IgE)
      as: Any food allergic sensitization (IgE)

  # Per-allergen dup for SPT variant.
  - id: merge_food_any_spt
    merge:
      select:
        any:
        - name: Skin prick test - Any food allergic sensitization
        - name: Any food allergic sensitization (Skin prick test)
      as: Any food allergic sensitization (Skin prick test)

  # Per-allergen dup for Any inhalant (IgE).
  - id: merge_inhalant_any_ige
    merge:
      select:
        any:
        - name: IgE - Any inhalant allergic sensitization
        - name: Any inhalant allergic sensitization (IgE)
      as: Any inhalant allergic sensitization (IgE)

  # Per-allergen dup for Cat (IgE).
  - id: merge_inhalant_cat_ige
    merge:
      select:
        any:
        - name: IgE - Cat
        - name: Cat (IgE)
      as: Cat (IgE)

  # Per-allergen dup for House dust mite (IgE).
  - id: merge_inhalant_hdm_ige
    merge:
      select:
        any:
        - name: IgE - House dust mite
        - name: House dust mite (IgE)
      as: House dust mite (IgE)

  # Per-allergen dup for Any inhalant (SPT) — note source has a double space.
  - id: merge_inhalant_any_spt
    merge:
      select:
        any:
        - name: Skin prick test - Any inhalant allergic sensitization
        - name: Any inhalant allergic sensitization  (Skin prick test)
      as: Any inhalant allergic sensitization (Skin prick test)

  # Per-allergen dup for Cat (SPT).
  - id: merge_inhalant_cat_spt
    merge:
      select:
        any:
        - name: Skin prick test - Cat
        - name: Cat (Skin prick test)
      as: Cat (Skin prick test)

  # Per-allergen dup for House dust mite (SPT).
  - id: merge_inhalant_hdm_spt
    merge:
      select:
        any:
        - name: Skin prick test - House dust mite
        - name: House dust mite (Skin prick test)
      as: House dust mite (Skin prick test)

  # 'Food' wrapper empty after IgE/SPT merges; children reparent up.
  - id: dissolve_food_wrapper
    dissolve:
      select:
        name: Food

  # 'Inhalant' wrapper empty after IgE/SPT merges; children reparent up.
  - id: dissolve_inhalant_wrapper
    dissolve:
      select:
        name: Inhalant

  # Dietary behavior (Preschool) vs Preschool age - Dietary behavior: same concept.
  - id: merge_preschool_dietary_behavior
    merge:
      select:
        any:
        - name: Dietary behavior (Preschool)
        - name: Preschool age - Dietary behavior
      as: Dietary behavior (Preschool)

  # Food groups (Preschool) vs Preschool age - Food groups: same concept.
  - id: merge_preschool_food_groups
    merge:
      select:
        any:
        - name: Food groups (Preschool)
        - name: Preschool age - Food groups
      as: Food groups (Preschool)

  # Method of dietary assessment: two-dialect dup inside Preschool age.
  - id: merge_preschool_method
    merge:
      select:
        any:
        - name: Method of dietary assessment (Preschool)
        - name: Preschool age - Method of dietary assessment
      as: Method of dietary assessment (Preschool)

  # Nutrients: two-dialect dup inside Preschool age.
  - id: merge_preschool_nutrients
    merge:
      select:
        any:
        - name: Nutrients (Preschool)
        - name: Preschool age - Nutrients
      as: Nutrients (Preschool)

  # Supplements: two-dialect dup inside Preschool age.
  - id: merge_preschool_supplements
    merge:
      select:
        any:
        - name: Supplements (Preschool)
        - name: Preschool age - Supplements
      as: Supplements (Preschool)

  # DASH diet index inside School age — dialect dup.
  - id: merge_school_dash
    merge:
      select:
        any:
        - name: DASH diet index
        - name: School age - DASH diet index
      as: DASH diet index (School)

  # Dietary behavior inside School age — dialect dup.
  - id: merge_school_dietary_behavior
    merge:
      select:
        any:
        - name: Dietary behavior (School)
        - name: School age - Dietary behavior
      as: Dietary behavior (School)

  # Exact age at dietary assessment inside School age — dialect dup.
  - id: merge_school_exact_age
    merge:
      select:
        any:
        - name: Exact age at dietary assessment (School)
        - name: School age - Exact age at dietary assessment
      as: Exact age at dietary assessment (School)

  # Food groups inside School age — dialect dup.
  - id: merge_school_food_groups
    merge:
      select:
        any:
        - name: Food groups (School)
        - name: School age - Food groups
      as: Food groups (School)

  # Method of dietary assessment inside School age — dialect dup.
  - id: merge_school_method
    merge:
      select:
        any:
        - name: Method of dietary assessment (School)
        - name: School age - Method of dietary assessment
      as: Method of dietary assessment (School)

  # Nutrients inside School age — dialect dup.
  - id: merge_school_nutrients
    merge:
      select:
        any:
        - name: Nutrients (School)
        - name: School age - Nutrients
      as: Nutrients (School)

  # Supplements inside School age — dialect dup.
  - id: merge_school_supplements
    merge:
      select:
        any:
        - name: Supplements (School)
        - name: School age - Supplements
      as: Supplements (School)

  # Cats (any) and Cats (number) are two representations of the same ownership concept.
  - id: merge_cats
    merge:
      select:
        any:
        - name: Cats (any)
        - name: Cats (number)
      as: Cats

  # Dogs (any) / Dogs (number) — same representation dup as cats.
  - id: merge_dogs
    merge:
      select:
        any:
        - name: Dogs (any)
        - name: Dogs (number)
      as: Dogs

  # lden and lden_categorical are continuous/discretised forms of the same noise metric.
  - id: merge_lden
    merge:
      select:
        any:
        - name: lden
        - name: lden_categorical
      as: lden

  # ln and ln_categorical — same continuous/discretised pair for night noise level.
  - id: merge_ln
    merge:
      select:
        any:
        - name: ln
        - name: ln_categorical
      as: ln

  # 'distance (traffic)' and 'distance_traffic' — pure dialect dup.
  - id: merge_traffic_distance
    merge:
      select:
        any:
        - name: distance (traffic)
        - name: distance_traffic
      as: distance_traffic

  # traffic_load_all_roads + traffic_load_major_roads — parameter variants of the same metric.
  - id: merge_traffic_load
    merge:
      select:
        any:
        - name: traffic_load_all_roads
        - name: traffic_load_major_roads
      as: Traffic load

  # _osm suffix marks the data source (OpenStreetMap), not a distinct concept.
  - id: merge_unhealthy_facilities
    merge:
      select:
        any:
        - name: unhealthy_facilities_density
        - name: unhealthy_facilities_density_osm
      as: unhealthy_facilities_density

  # min/max/mean/land_surface_temperature are parameter variants of one metric.
  - id: merge_temperature
    merge:
      select:
        any:
        - name: maximum_temperature
        - name: minimum_temperature
        - name: mean_temperature
        - name: land_surface_temperature
      as: Temperature

  # min/max/mean_relative_humidity — same parameter-variant collapse.
  - id: merge_humidity
    merge:
      select:
        any:
        - name: maximum_relative_humidity
        - name: minimum_relative_humidity
        - name: mean_relative_humidity
      as: Relative humidity

  # DNA_damage / erythemal / vitamin_d UV dose are three action-spectrum variants.
  - id: merge_uv_dose
    merge:
      select:
        any:
        - name: DNA_damage_UV_dose
        - name: erythemal_UV_dose
        - name: vitamin_d_UV_dose
      as: UV dose

  # 13 main_land_use_* CORINE subtypes flattened into one 'Land use' concept.
  - id: merge_land_use
    merge:
      select:
        re: ^main_land_use(_.+)?$
      as: Land use


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE C — Cross-subtree reroutes
  # ════════════════════════════════════════════════════════════════════════════

  # 'Sex' under Birth outcomes duplicates 'Sex/gender' under Socio-demographic.
  - id: reroute_sex
    reroute:
      select:
        name: Sex
      to: Sex/gender
      keep_as_keyword: true

  # CHICOS, ISAAC, MeDALL are questionnaire instrument names, not distinct asthma subtypes.
  - id: merge_asthma_instruments
    merge:
      select:
        any:
        - name: Asthma
        - name: CHICOS
        - name: ISAAC
        - name: MeDALL
      as: Asthma


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE D — Representation-variant collapses (Spirometry units; Sitting height)
  # ════════════════════════════════════════════════════════════════════════════

  # Absolute / Z-score (X) are unit variants of each spirometry metric, not subconcepts.
  - id: spirometry_absorb_units
    flatten:
      select:
        all:
        - parent: Spirometry
        - children: '>0'
      absorb:
        match: ^(?P<unit>Absolute|Z-score) \(
      definition_suffix: 'Measurement variants: {unit}.'

  # Orphan 'Absolute' leaf under Spirometry is a data-entry artifact.
  - id: spirometry_stray_absolute
    reroute:
      select:
        name: Absolute
      to: Spirometry
      keep_as_keyword: true

  # Sitting height is a body-posture variant of Child's height, not a separate concept.
  - id: sitting_height_into_child_height
    reroute:
      select:
        name: Sitting height
      to: Child's height
      keep_as_keyword: true


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE E — Extract-facet groupings (pm species, ndvi buffers, built env buffers)
  # ════════════════════════════════════════════════════════════════════════════

  # pm10*/pm25* component variants (cu, fe, k, ni, s, si, v, zn, abs) fold into PM10/PM2.5.
  - id: air_pollution_pm_species
    extract_facet:
      select:
        parent: Air pollution
      pattern: ^pm(?P<size>10|25)(?P<component>.*)$
      group_by: size
      name_template: PM{size}
      definition_suffix: 'Species/components: {component|join:'',''}.'

  # Case fix: no2 → NO2 (standard acronym).
  - id: rename_no2
    rename:
      select:
        name: no2
      to: NO2

  # Case fix: nox → NOx.
  - id: rename_nox
    rename:
      select:
        name: nox
      to: NOx

  # ndvi / ndvi100 / ndvi300 / ndvi500 are buffer-radius parameter variants.
  - id: ndvi_buffer
    extract_facet:
      select:
        parent: Natural spaces
      pattern: ^(?P<concept>ndvi)(?P<buffer>\d*)$
      group_by: concept
      name_template: NDVI
      definition_suffix: 'Buffer radii (m): {buffer}.'

  # General 100/300/500m buffer-radius pattern across built env variables.
  - id: built_env_buffer_radii
    extract_facet:
      select:
        parent: Built environment/neighbourhood characteristics
      pattern: ^(?P<concept>.+?)(?P<buffer>\d{3})$
      group_by: concept
      name_template: '{concept}'
      definition_suffix: 'Buffer radii (m): {buffer}.'


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE F — Dissolve content-free 'Other X' wrappers
  # ════════════════════════════════════════════════════════════════════════════

  # Content-free catchall wrapper; contents reparent to Administrative information.
  - id: dissolve_other_admin
    dissolve:
      select:
        name: Other administrative information
      on_collision: keep_destination

  # 'Other reproductive health' — content-free leaf with no distinguishing payload.
  - id: dissolve_other_reproductive
    dissolve:
      select:
        name: Other reproductive health-related information
      on_collision: keep_destination

  # Content-free catchall under Death.
  - id: dissolve_other_end_of_life
    dissolve:
      select:
        name: Other end of life or death-related information
      on_collision: keep_destination

  # Content-free catchall under Laboratory measures.
  - id: dissolve_other_laboratory
    dissolve:
      select:
        name: Other laboratory measures
      on_collision: keep_destination

  # Content-free catchall under Life events.
  - id: dissolve_other_life_events
    dissolve:
      select:
        name: Other life events, plans and beliefs
      on_collision: keep_destination

  # Content-free catchall under Lifestyle and behaviours.
  - id: dissolve_other_lifestyle
    dissolve:
      select:
        name: Other and unspecified lifestyle information
      on_collision: keep_destination

  # Content-free catchall under Medication and supplements.
  - id: dissolve_other_pharma
    dissolve:
      select:
        name: Other and unspecified pharmacological interventions
      on_collision: keep_destination

  # Content-free catchall under Non-pharmacological interventions.
  - id: dissolve_other_nonpharma
    dissolve:
      select:
        name: Other and unspecified non-pharmacological interventions
      on_collision: keep_destination

  # Content-free catchall under Perception of health.
  - id: dissolve_other_perception
    dissolve:
      select:
        name: Other perception of health, quality of life and functional limitation-related information
      on_collision: keep_destination

  # Content-free catchall under Physical measures.
  - id: dissolve_other_physical_measures
    dissolve:
      select:
        name: Other physical measures and assessments
      on_collision: keep_destination

  # Content-free catchall under Preschool, school and work life.
  - id: dissolve_other_preschool_work
    dissolve:
      select:
        name: Other preschool, school or work life-related information
      on_collision: keep_destination

  # Content-free catchall under Socio-demographic.
  - id: dissolve_other_sociodemo
    dissolve:
      select:
        name: Other socio-demographic and economic characteristics
      on_collision: keep_destination

  # Content-free catchall under Health and community care.
  - id: dissolve_other_health_community
    dissolve:
      select:
        name: Other health and community care
      on_collision: keep_destination

  # Content-free catchall under Social environment (has one child: Family mental health).
  - id: dissolve_other_social_env
    dissolve:
      select:
        name: Other social environment characteristics
      on_collision: keep_destination


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE G — Physical measures flattens (Circumferences, Skinfold); Child asthma wrapper; Diseases-unspec
  # ════════════════════════════════════════════════════════════════════════════

  # Arm/Head/Hip/Waist are body-site variants of one measurement concept.
  - id: flatten_circumferences
    flatten:
      select:
        name: Circumferences
      absorb:
        match: ^(?P<site>.+)$
      definition_suffix: 'Body sites: {site}.'

  # Bicep/Subscapular/Suprailiac/Tricep — same body-site variants pattern.
  - id: flatten_skinfold
    flatten:
      select:
        name: Skinfold
      absorb:
        match: ^(?P<site>.+)$
      definition_suffix: 'Body sites: {site}.'

  # Wrapper kept only one concept (Asthma + Asthma medication); dissolved for M/P/C symmetry.
  - id: dissolve_child_asthma_wrapper
    dissolve:
      select:
        name: Child asthma
      on_collision: keep_destination

  # Catchall 'Diseases without precise specification' absorbed into Diseases root.
  - id: reroute_diseases_unspec
    reroute:
      select:
        name: Diseases without precise specification or falling into multiple categories
      to: Diseases
      keep_as_keyword: true
      on_collision: keep_destination


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE H — Naming consistency (sentence case, standard acronyms, subject suffix normalisation)
  # ════════════════════════════════════════════════════════════════════════════

  # PM25 → PM2.5 (standard form).
  - id: rename_pm25
    rename:
      select:
        name: PM25
      to: PM2.5

  # pmcoarse → PMcoarse (standard form).
  - id: rename_pmcoarse
    rename:
      select:
        name: pmcoarse
      to: PMcoarse

  # snake_case → noun phrase.
  - id: rename_building_density
    rename:
      select:
        name: building_density
      to: Building density

  # snake_case → 'Street connectivity density' (clearer than 'Connectivity density').
  - id: rename_connectivity_density
    rename:
      select:
        name: connectivity_density
      to: Street connectivity density

  # snake_case → noun phrase.
  - id: rename_facilities_density
    rename:
      select:
        name: facilities_density
      to: Facilities density

  # snake_case → noun phrase.
  - id: rename_facilities_richness
    rename:
      select:
        name: facilities_richness
      to: Facilities richness

  # snake_case → noun phrase.
  - id: rename_land_use_mix
    rename:
      select:
        name: land_use_mix
      to: Land use mix

  # snake_case → noun phrase.
  - id: rename_population_density
    rename:
      select:
        name: population_density
      to: Population density

  # 'walkability' → 'Walkability index' (it IS an index, not a property).
  - id: rename_walkability
    rename:
      select:
        name: walkability
      to: Walkability index

  # snake_case → 'Access to public transport lines'.
  - id: rename_access_lines
    rename:
      select:
        name: access_to_public_transport_lines
      to: Access to public transport lines

  # snake_case → 'Access to public transport stops'.
  - id: rename_access_stops
    rename:
      select:
        name: access_to_public_transport_stops
      to: Access to public transport stops

  # snake_case → 'Area-level SES (quintiles)'.
  - id: rename_ses_quintiles
    rename:
      select:
        name: area_level_ses_quintiles
      to: Area-level SES (quintiles)

  # snake_case → 'Area-level SES (tertiles)'.
  - id: rename_ses_tertiles
    rename:
      select:
        name: area_level_ses_tertiles
      to: Area-level SES (tertiles)

  # snake_case → 'Access to blue space'.
  - id: rename_blue_access
    rename:
      select:
        name: blue_access
      to: Access to blue space

  # snake_case → 'Distance to blue space'.
  - id: rename_blue_distance
    rename:
      select:
        name: blue_distance
      to: Distance to blue space

  # snake_case → 'Size of blue space'.
  - id: rename_blue_size
    rename:
      select:
        name: blue_size
      to: Size of blue space

  # snake_case → 'Access to green space'.
  - id: rename_green_access
    rename:
      select:
        name: green_access
      to: Access to green space

  # snake_case → 'Distance to green space'.
  - id: rename_green_distance
    rename:
      select:
        name: green_distance
      to: Distance to green space

  # snake_case → 'Size of green space'.
  - id: rename_green_size
    rename:
      select:
        name: green_size
      to: Size of green space

  # snake_case → 'Distance to meteorological station'.
  - id: rename_meteo_distance
    rename:
      select:
        name: meteo_distance
      to: Distance to meteorological station

  # 'distance (noise)' → 'Distance to noise source'.
  - id: rename_distance_noise
    rename:
      select:
        name: distance (noise)
      to: Distance to noise source

  # Cryptic acronym: 'Day-evening-night noise level (Lden)'.
  - id: rename_lden
    rename:
      select:
        name: lden
      to: Day-evening-night noise level (Lden)

  # Cryptic acronym: 'Night noise level (Ln)'.
  - id: rename_ln
    rename:
      select:
        name: ln
      to: Night noise level (Ln)

  # snake_case → 'Distance to road'.
  - id: rename_distance_traffic
    rename:
      select:
        name: distance_traffic
      to: Distance to road

  # snake_case → sentence case.
  - id: rename_traffic_density
    rename:
      select:
        name: traffic_density
      to: Traffic density

  # snake_case → 'Unhealthy food facility density'.
  - id: rename_unhealthy_facilities
    rename:
      select:
        name: unhealthy_facilities_density
      to: Unhealthy food facility density

  # Non-standard abbreviation spelled out: 'Organochlorines and PBDEs'.
  - id: rename_ocs_pbdes
    rename:
      select:
        name: OCs & PBDEs
      to: Organochlorines and PBDEs

  # (F) → (maternal): subject-axis normalisation.
  - id: rename_dash_f
    rename:
      select:
        name: DASH diet index (F)
      to: DASH diet index (maternal)

  # (M) → (paternal).
  - id: rename_dash_m
    rename:
      select:
        name: DASH diet index (M)
      to: DASH diet index (paternal)

  # (F) → (maternal).
  - id: rename_food_groups_f
    rename:
      select:
        name: Food groups (F)
      to: Food groups (maternal)

  # (M) → (paternal).
  - id: rename_food_groups_m
    rename:
      select:
        name: Food groups (M)
      to: Food groups (paternal)

  # (F) → (maternal).
  - id: rename_method_f
    rename:
      select:
        name: Method of dietary assessment (F)
      to: Method of dietary assessment (maternal)

  # (M) → (paternal).
  - id: rename_method_m
    rename:
      select:
        name: Method of dietary assessment (M)
      to: Method of dietary assessment (paternal)

  # (F) → (maternal).
  - id: rename_nutrients_f
    rename:
      select:
        name: Nutrients (F)
      to: Nutrients (maternal)

  # (M) → (paternal).
  - id: rename_nutrients_m
    rename:
      select:
        name: Nutrients (M)
      to: Nutrients (paternal)

  # (F) → (maternal).
  - id: rename_supplements_f
    rename:
      select:
        name: Supplements (F)
