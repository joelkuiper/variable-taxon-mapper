        name: Food facility density (unhealthy)
      to: Food facility density

  # ======================================================================
  # Phase 24: Biochemistry coverage expansion + Water quality (55k load analysis)
  # ======================================================================
  # Broaden from Cholesterol to Lipid panel (55k load analysis).
  - id: rename_cholesterol_to_lipid_panel
    rename:
      select:
        name: Cholesterol
      to: Lipid panel
  # ~200 glucose/insulin/HbA1c variables need a leaf (55k load analysis).
  - id: add_glucose_insulin
    add_node:
      name: Glucose and insulin metabolism
      parent: Biochemistry
      definition: Blood glucose, fasting glucose, oral glucose tolerance test (OGTT), insulin, HbA1c, HOMA-IR, and related glycaemic markers.
  # ~30 ALT/AST/GGT/bilirubin variables need a leaf.
  - id: add_liver_function
    add_node:
      name: Liver function
      parent: Biochemistry
      definition: Alanine aminotransferase (ALT), aspartate aminotransferase (AST), gamma-glutamyl transferase (GGT), alkaline phosphatase (ALP), bilirubin, albumin, and related hepatic markers.
  # ~15 TSH/fT4/fT3 variables need a leaf.
  - id: add_thyroid_function
    add_node:
      name: Thyroid function
      parent: Biochemistry
      definition: Thyroid-stimulating hormone (TSH), free thyroxine (fT4), free triiodothyronine (fT3), and related thyroid markers.
  # ~30 CRP/interleukin/TNF variables need a leaf.
  - id: add_inflammatory_markers
    add_node:
      name: Inflammatory markers
      parent: Biochemistry
      definition: C-reactive protein (CRP), high-sensitivity CRP (hs-CRP), interleukins (IL-1, IL-6, IL-8, IL-10), tumour necrosis factor (TNF-alpha), and related inflammatory and cytokine markers.
  # ~15 cortisol/testosterone/estrogen variables need a leaf.
  - id: add_hormones
    add_node:
      name: Hormones
      parent: Biochemistry
      definition: Cortisol, testosterone, estradiol, progesterone, DHEA-S, sex hormone-binding globulin (SHBG), leptin, adiponectin, and related endocrine markers.
  # ~10 folate/ferritin/vitamin D/B12 variables need a leaf.
  - id: add_vitamins_minerals
    add_node:
      name: Vitamins and minerals
      parent: Biochemistry
      definition: Serum folate, vitamin D (25-hydroxyvitamin D), vitamin B12, ferritin, iron, zinc, and related micronutrient markers.
  # ~360 water-quality variables in the 55k set have no home.
  - id: add_water_quality
    add_node:
      name: Water quality
      parent: Chemicals
      definition: 'Drinking-water quality parameters: hardness, pH, conductivity, turbidity, fluoride, nitrate, nitrite, chlorination by-products, and trace-element concentrations in water supplies.'

  # ======================================================================
  # Invariant checks
  # ======================================================================
  - check:
      assert: ledger_preserved
  - check:
      assert: name_unique
