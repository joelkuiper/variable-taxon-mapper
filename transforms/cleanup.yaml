- id: spirometry_absorb_units
  flatten:
    select:
      all:
      - parent: Spirometry
      - children: '>0'
    absorb:
      match: ^(?P<unit>Absolute|Z-score) \(
    definition_suffix: 'Measurement variants: {unit}.'
- id: spirometry_stray_absolute
