  # Birth-cohort standard; previously absent from the taxonomy.
  - id: add_vaccinations
    add_node:
      name: Vaccinations
      parent: Health and community care services utilization
      definition: Immunisation records, including childhood vaccination schedule and additional vaccines (influenza, COVID-19, travel).

