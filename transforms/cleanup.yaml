version: 1
description: 'cleanup.yaml: canonical single-pass restructure of Keywords_summarized_new.csv. Merges iterative drafts cleanup_v1 + cleanup_v2 + cleanup_v3 + restructure_v4 + over-long-root renames into one script. Source 509 → ~415 nodes. Collapses the four overlapping organizing schemes onto one coherent axis: nosological (ICD), method (Lab/Physical measures), life-domain (Lifestyle/Social/Preschool), subject metadata (Admin/Sociodemo/Pregnancy). Adds a comprehensive mental health subtree under F00-F99, biological samples, genomics breakdown, microbiome, pregnancy outcomes, vaccinations. Preserves M/P/C subject splits, ICD chapter scaffolding, per-allergen leaves. Folds representation/parameter axes (unit, buffer, pm species, land use, temperature/humidity/UV, noise categorical) into keywords. Renames every node to a consistent style (sentence case, no snake_case, standardized acronyms).'
