  # PHASE K — Pregnancy outcomes and vaccinations scaffolding
  # ════════════════════════════════════════════════════════════════════════════

  # Populate the empty O00-O9A chapter with canonical pregnancy outcomes.
  - id: add_miscarriage
    add_node:
      name: Miscarriage
      parent: Pregnancy, childbirth and the puerperium (O00-O9A)
      definition: Spontaneous abortion before 24 weeks gestation.

  # Populate O00-O9A.
  - id: add_stillbirth
    add_node:
      name: Stillbirth
      parent: Pregnancy, childbirth and the puerperium (O00-O9A)
      definition: Fetal death after 24 weeks gestation.

  # Populate O00-O9A.
  - id: add_ectopic
    add_node:
      name: Ectopic pregnancy
      parent: Pregnancy, childbirth and the puerperium (O00-O9A)
      definition: Pregnancy implanted outside the uterine cavity.

  # Populate O00-O9A.
  - id: add_pregnancy_termination
    add_node:
      name: Pregnancy termination
      parent: Pregnancy, childbirth and the puerperium (O00-O9A)
