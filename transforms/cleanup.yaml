    rename:
      select:
        name: Perception of health, quality of life, development and functional limitations
      to: Quality of life and functioning

  # Paragraph-style root name → 'Pregnancy and reproductive history'.
  - id: rename_birth_pregnancy_root
    rename:
      select:
        name: Birth, pregnancy and reproductive health history
      to: Pregnancy and reproductive history

  # Paragraph-style root name → 'Life events and beliefs'.
  - id: rename_life_events_root
    rename:
      select:
        name: Life events, life plans, beliefs and values
      to: Life events and beliefs


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE S — Anthropometry intermediate wrapper
  # ════════════════════════════════════════════════════════════════════════════

  # Awkward wrapper 'Physical and cognitive measure and biosample-related information' between
  # Anthropometry and its height/weight leaves.
  - id: dissolve_anthropometry_biosamp_wrapper
    dissolve:
      select:
        name: Physical and cognitive measure and biosample-related information
      on_collision: keep_destination


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE T — Built environment 4-axis restructure (Land cover / Spatial density / Accessibility / Composite)
  # ════════════════════════════════════════════════════════════════════════════

  # 4-axis split parent: what the land IS (CORINE-style categorical).
  - id: add_built_env_land_cover
    add_node:
      name: Land cover
      parent: Built environment/neighbourhood characteristics
      definition: 'Categorical land-cover classes and diversity metrics (following EU CORINE / Urban Atlas conventions): what the land IS.'

  # 4-axis split parent: how much stuff per unit area (continuous density metrics).
  - id: add_built_env_spatial_density
    add_node:
      name: Spatial density metrics
      parent: Built environment/neighbourhood characteristics
      definition: Continuous density and count-per-area metrics derived from the built environment (population, buildings, street network, facilities).

  # 4-axis split parent: how close/reachable things are.
  - id: add_built_env_accessibility
    add_node:
      name: Accessibility and proximity
      parent: Built environment/neighbourhood characteristics
      definition: Distance-to and presence-within-buffer metrics for amenities, transport, and natural or built features.

  # 4-axis split parent: derived composite indices (walkability, etc.).
  - id: add_built_env_composite_indices
    add_node:
      name: Composite indices
      parent: Built environment/neighbourhood characteristics
      definition: Derived composite indicators that combine multiple built-environment measures into a single score (e.g. walkability).

  # Land use (CORINE categorical) → Land cover axis.
  - id: promote_land_use_to_cover
    promote:
      select:
        name: Land use
      to: Land cover

  # Land use mix (Shannon diversity over CORINE classes) → Land cover axis.
  - id: promote_land_use_mix_to_cover
    promote:
      select:
        name: Land use mix
      to: Land cover

  # Population density → Spatial density metrics axis.
  - id: promote_pop_density
    promote:
      select:
        name: Population density
      to: Spatial density metrics

  # Building density → Spatial density metrics axis.
  - id: promote_building_density
    promote:
      select:
        name: Building density
      to: Spatial density metrics

  # Street connectivity density → Spatial density metrics axis.
  - id: promote_street_connectivity
    promote:
      select:
        name: Street connectivity density
      to: Spatial density metrics

  # Facilities density → Spatial density metrics axis.
  - id: promote_facilities_density
    promote:
      select:
        name: Facilities density
      to: Spatial density metrics

  # Facilities richness → Spatial density metrics axis.
  - id: promote_facilities_richness
    promote:
      select:
        name: Facilities richness
      to: Spatial density metrics

  # Access to public transport lines → Accessibility and proximity axis.
  - id: promote_access_pt_lines
    promote:
      select:
        name: Access to public transport lines
      to: Accessibility and proximity

  # Access to public transport stops → Accessibility and proximity axis.
  - id: promote_access_pt_stops
    promote:
      select:
        name: Access to public transport stops
      to: Accessibility and proximity

  # Walkability index → Composite indices (derived metric, not a primary).
  - id: promote_walkability
    promote:
      select:
        name: Walkability index
      to: Composite indices


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE U — Food environment / Unhealthy food facility density merge (one concept, two labels)
  # ════════════════════════════════════════════════════════════════════════════

  # Food environment and Unhealthy food facility density are the same concept — POI-based
  # food-related density metrics — with inconsistent cohort-author labeling (same methodology,
  # same buffer radii, same source). Merge and move under Spatial density metrics where they
  # structurally belong.
  - id: merge_food_env_density
    merge:
      select:
        any:
        - name: Food environment
        - name: Unhealthy food facility density
      as: Food facility density (unhealthy)
      into_parent: Spatial density metrics
      on_collision: keep_destination

  # Parent wrapper empty after Unhealthy food facility density merged out.
  - id: dissolve_unhealthy_food_env_wrapper
    dissolve:
      select:
        name: Unhealthy food environment
      on_collision: keep_destination

  # Drop the '(unhealthy)' qualifier: only 9 of 591 food-env variables (the precomputed
  # foodenvdens composite) are explicitly 'unhealthy' in the source. The other 582
  # (supermarket, cafe, restaurant, etc.) are neutral POI-category counts. The editorial
  # framing lives in keywords/definitions, not the node name.
  - id: rename_food_facility_density_neutral
    rename:
      select:
        name: Food facility density (unhealthy)
      to: Food facility density


  # ════════════════════════════════════════════════════════════════════════════
  # Invariant checks — run after every rule automatically; these document intent.
  # ════════════════════════════════════════════════════════════════════════════

  - check: {assert: ledger_preserved}
  - check: {assert: name_unique}
