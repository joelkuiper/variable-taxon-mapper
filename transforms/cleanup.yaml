  # PHASE M — Lab measurements → Laboratory measures
  # ════════════════════════════════════════════════════════════════════════════

  # Serum lipid panel is Biochemistry, not a Physical measure.
  - id: promote_cholesterol_to_lab
    promote:
      select:
        name: Cholesterol
      to: Biochemistry

  # Cotinine → Toxicology: tobacco biomarker is a lab measurement, final hop.
  - id: promote_cotinine_to_lab
    promote:
      select:
        name: Cotinine
      to: Toxicology

  # Creatinine → Biochemistry: final hop into correct lab subdomain.
  - id: promote_creatinine_to_lab
    promote:
      select:
        name: Creatinine
      to: Biochemistry

  # '(Molecular) biomarkers' intermediate wrapper empty after Cotinine/Creatinine moved.
  - id: dissolve_molecular_biomarkers
    dissolve:
      select:
        name: Molecular biomarkers
      on_collision: keep_destination


  # ════════════════════════════════════════════════════════════════════════════
  # PHASE N — Allergy root dissolution (sensitization → Lab; conditions → ICD chapters)
  # ════════════════════════════════════════════════════════════════════════════

  # Lab tests (IgE, SPT) belong under Lab > Immunology, not as a root.
  - id: promote_allergic_sensitization_to_immunology
    promote:
      select:
        name: Allergic sensitization
      to: Immunology

  # T78.2 anaphylactic shock — Injury/poisoning chapter (S00-T98).
  - id: promote_anaphylaxis_to_injury
    promote:
      select:
        name: Anaphylaxis
      to: Injury, poisoning and certain other consequences of external causes (S00-T98)

  # T78.1 other adverse food reactions — Injury/poisoning chapter.
  - id: promote_food_allergy_to_injury
    promote:
      select:
        name: Food allergy
      to: Injury, poisoning and certain other consequences of external causes (S00-T98)

  # J30 allergic rhinitis — J00-J99 respiratory chapter.
  - id: promote_inhalant_allergy_to_respiratory
    promote:
      select:
        name: Inhalant allergy
      to: Diseases of the respiratory system (J00-J99)

  # L50 urticaria — L00-L99 skin chapter.
  - id: promote_urticaria_to_skin
    promote:
      select:
        name: Urticaria
      to: Diseases of the skin and subcutaneous tissue (L00-L99)

  # Catchall 'Any allergy' with Anaphylaxis/Food allergy — same Injury chapter.
  - id: promote_any_allergy_to_injury
    promote:
      select:
        name: Any allergy
      to: Injury, poisoning and certain other consequences of external causes (S00-T98)

  # Allergy root now empty after all contents redistributed; reroute payload into Diseases.
  - id: reroute_allergy_root
    reroute:
      select:
        name: Allergy
      to: Diseases
      keep_as_keyword: true
      on_collision: keep_destination


