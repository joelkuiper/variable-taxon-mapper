- id: add_substance_use_disorders
  add_node:
    name: Substance use disorders (F10-F19)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F10-F19. Mental and behavioural disorders due to psychoactive substance use, including tobacco, alcohol, cannabis, opioids, sedatives, stimulants, and other psychoactive substances.
- id: add_schizophrenia
  add_node:
    name: Schizophrenia and psychotic disorders (F20-F29)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F20-F29. Schizophrenia, schizotypal and delusional disorders.
- id: add_mood_disorders
  add_node:
    name: Mood disorders (F30-F39)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F30-F39. Mood (affective) disorders, including depression, bipolar disorder, persistent mood disorders.
- id: add_anxiety_disorders
  add_node:
    name: Anxiety, stress and trauma-related disorders (F40-F48)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F40-F48. Phobic anxiety disorders, generalised anxiety, panic, obsessive-compulsive disorder, reactions to severe stress (PTSD, acute stress), dissociative disorders, somatoform disorders.
- id: add_eating_disorders
  add_node:
    name: Eating disorders (F50)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F50. Anorexia nervosa, bulimia nervosa, binge eating disorder, and other eating disorders.
- id: add_personality_disorders
  add_node:
    name: Personality disorders (F60-F69)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F60-F69. Disorders of adult personality and behaviour.
- id: add_intellectual_disability
  add_node:
    name: Intellectual disability (F70-F79)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F70-F79. Intellectual disability (formerly mental retardation), classified by severity.
- id: add_developmental_disorders
  add_node:
    name: Disorders of psychological development (F80-F89)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F80-F89. Disorders of psychological development including autism spectrum disorders, specific developmental disorders of speech and language, scholastic skills, and motor function.
- id: add_childhood_disorders
  add_node:
    name: Behavioural and emotional disorders with onset in childhood (F90-F98)
    parent: Mental and behavioural disorders (F00-F99)
    definition: ICD-10 F90-F98. Hyperkinetic disorders, conduct disorders, mixed disorders of conduct and emotions, tic disorders, and other behavioural and emotional disorders typically beginning in childhood and adolescence.
- id: add_depression
  add_node:
    name: Depression
    parent: Mood disorders (F30-F39)
    definition: Depressive episodes and recurrent depressive disorder. Includes major depressive disorder.
- id: add_bipolar
  add_node:
    name: Bipolar disorder
    parent: Mood disorders (F30-F39)
    definition: Bipolar affective disorder, characterised by repeated episodes of mood disturbance involving both manic/hypomanic and depressive states.
- id: add_postpartum_depression
  add_node:
    name: Postpartum depression
    parent: Mood disorders (F30-F39)
    definition: Depressive episode with onset in the postpartum period (typically within 4-6 weeks of delivery, but extending up to one year).
- id: add_anxiety
  add_node:
    name: Anxiety disorders
    parent: Anxiety, stress and trauma-related disorders (F40-F48)
    definition: Generalised anxiety disorder, panic disorder, social anxiety, separation anxiety, and other anxiety disorders.
- id: add_phobic
  add_node:
    name: Phobic disorders
    parent: Anxiety, stress and trauma-related disorders (F40-F48)
    definition: Specific phobias, agoraphobia, social phobias.
- id: add_ocd
  add_node:
    name: Obsessive-compulsive disorder
    parent: Anxiety, stress and trauma-related disorders (F40-F48)
    definition: Recurrent intrusive thoughts (obsessions) and/or repetitive behaviours (compulsions).
- id: add_ptsd
  add_node:
    name: Post-traumatic stress disorder
    parent: Anxiety, stress and trauma-related disorders (F40-F48)
    definition: Delayed or protracted response to a stressful event of an exceptionally threatening or catastrophic nature.
- id: add_anorexia
  add_node:
    name: Anorexia nervosa
    parent: Eating disorders (F50)
    definition: Eating disorder characterised by deliberate restriction of food intake and excessive concern about body weight and shape.
- id: add_bulimia
  add_node:
    name: Bulimia nervosa
    parent: Eating disorders (F50)
    definition: Eating disorder characterised by recurrent episodes of binge eating followed by compensatory behaviours.
- id: add_binge_eating
  add_node:
    name: Binge eating disorder
    parent: Eating disorders (F50)
    definition: Recurrent episodes of binge eating without regular compensatory behaviours.
- id: add_autism
  add_node:
    name: Autism spectrum disorder
    parent: Disorders of psychological development (F80-F89)
    definition: Pervasive developmental disorder characterised by qualitative impairments in social interaction and communication, and a restricted, stereotyped, repetitive repertoire of interests and activities.
- id: add_specific_learning
  add_node:
    name: Specific learning disorders
    parent: Disorders of psychological development (F80-F89)
    definition: Specific developmental disorders of scholastic skills (reading, spelling, arithmetic) not attributable to general intellectual disability or inadequate schooling.
- id: add_speech_language
  add_node:
    name: Speech and language disorders
    parent: Disorders of psychological development (F80-F89)
    definition: 'Specific developmental disorders of speech and language: expressive language disorder, receptive language disorder, phonological disorder, stuttering.'
- id: add_adhd
  add_node:
    name: Attention-deficit/hyperactivity disorder (ADHD)
    parent: Behavioural and emotional disorders with onset in childhood (F90-F98)
    definition: Hyperkinetic disorder characterised by inattention, impulsivity, and hyperactivity beyond what is developmentally appropriate.
- id: add_conduct
  add_node:
    name: Conduct and oppositional defiant disorder
    parent: Behavioural and emotional disorders with onset in childhood (F90-F98)
    definition: Repetitive and persistent pattern of dissocial, aggressive, or defiant conduct (conduct disorder) or pattern of negativistic, hostile, defiant behaviour (oppositional defiant disorder).
- id: add_tic
  add_node:
    name: Tic disorders
    parent: Behavioural and emotional disorders with onset in childhood (F90-F98)
    definition: Transient or chronic motor and/or vocal tics, including Tourette syndrome.
- id: add_biosamples
  add_node:
    name: Biological samples
    parent: Laboratory measures
    definition: Inventory of biological specimens collected and stored from cohort participants.
- id: add_cord_blood
  add_node:
    name: Cord blood
    parent: Biological samples
    definition: Blood collected from the umbilical cord at delivery.
- id: add_maternal_blood
  add_node:
    name: Maternal blood
    parent: Biological samples
    definition: Whole blood, serum, or plasma collected from the mother.
- id: add_paternal_blood
  add_node:
    name: Paternal blood
    parent: Biological samples
    definition: Whole blood, serum, or plasma collected from the father.
- id: add_child_blood
  add_node:
    name: Child blood
    parent: Biological samples
    definition: Whole blood, serum, or plasma collected from the child at one or more follow-up time points.
- id: add_urine
  add_node:
    name: Urine
    parent: Biological samples
    definition: Urine specimens collected from mother, father, and/or child.
- id: add_stool
  add_node:
    name: Stool
    parent: Biological samples
    definition: Faecal specimens, typically used for microbiome and pathogen analyses.
- id: add_hair
  add_node:
    name: Hair
    parent: Biological samples
    definition: Hair specimens, used for retrospective exposure assessment (cortisol, heavy metals, drug use).
- id: add_saliva
  add_node:
    name: Saliva
    parent: Biological samples
    definition: Saliva specimens, often used for cortisol or DNA extraction.
- id: add_breast_milk
  add_node:
    name: Breast milk
    parent: Biological samples
    definition: Breast milk specimens, used for nutritional, hormonal, and exposure analyses.
- id: add_placenta
  add_node:
    name: Placenta
    parent: Biological samples
    definition: Placental tissue collected at delivery.
- id: add_buccal_swab
  add_node:
    name: Buccal swab
    parent: Biological samples
    definition: Buccal cell specimens collected by swab, typically used for DNA extraction.
- id: add_amniotic_fluid
  add_node:
    name: Amniotic fluid
    parent: Biological samples
    definition: Amniotic fluid specimens, typically obtained during clinically indicated amniocentesis.
- id: add_snp_genotyping
  add_node:
    name: SNP genotyping
    parent: Genomics
    definition: Single-nucleotide polymorphism genotyping data, typically generated using genome-wide arrays.
- id: add_wgs
  add_node:
    name: Whole-genome sequencing
    parent: Genomics
    definition: Whole-genome sequencing data.
- id: add_wes
  add_node:
    name: Whole-exome sequencing
    parent: Genomics
    definition: Whole-exome sequencing data.
- id: add_methylation
  add_node:
    name: DNA methylation
    parent: Genomics
    definition: DNA methylation profiles, typically generated using methylation arrays or bisulfite sequencing.
- id: add_transcriptomics
  add_node:
    name: Transcriptomics
    parent: Genomics
    definition: Gene expression profiling, typically generated using RNA sequencing or microarrays.
- id: add_microbiome
  add_node:
    name: Microbiome
    parent: Microbiology
    definition: Microbial community profiling from biological specimens (stool, skin, oral, vaginal).
- id: add_16s
  add_node:
    name: 16S rRNA sequencing
    parent: Microbiome
    definition: Amplicon sequencing of the 16S ribosomal RNA gene for bacterial community profiling.
- id: add_shotgun
  add_node:
    name: Shotgun metagenomics
    parent: Microbiome
    definition: Untargeted shotgun sequencing of all DNA in a microbial community sample.
- id: add_miscarriage
  add_node:
    name: Miscarriage
    parent: Pregnancy, childbirth and the puerperium (O00-O9A)
    definition: Spontaneous abortion before 24 weeks gestation.
- id: add_stillbirth
  add_node:
    name: Stillbirth
    parent: Pregnancy, childbirth and the puerperium (O00-O9A)
    definition: Fetal death after 24 weeks gestation.
- id: add_ectopic
  add_node:
    name: Ectopic pregnancy
    parent: Pregnancy, childbirth and the puerperium (O00-O9A)
    definition: Pregnancy implanted outside the uterine cavity.
- id: add_pregnancy_termination
  add_node:
    name: Pregnancy termination
    parent: Pregnancy, childbirth and the puerperium (O00-O9A)
    definition: Induced abortion, medical or surgical.
- id: add_vaccinations
  add_node:
    name: Vaccinations
    parent: Health and community care services utilization
    definition: Immunisation records, including childhood vaccination schedule and additional vaccines (influenza, COVID-19, travel).
- id: add_childhood_immunization
  add_node:
    name: Childhood immunisation schedule
    parent: Vaccinations
    definition: Vaccines administered as part of the national childhood immunisation programme.
