version: 1
description: "Stage 2 smoke: promote, dissolve, merge on real subtrees."

rules:
  # Cerebral palsy is a neurological disease miscategorized under Birth outcomes.
  - id: promote_cerebral_palsy
    promote:
      select: { name: "Cerebral palsy" }
      to: "Diseases of the nervous system (G00-G99)"

  # Dissolve a redundant internal wrapper.
  - id: dissolve_food_wrapper
    dissolve:
      select: { name: "Food" }

  # Merge the two duplicate Inhalant IgE nodes.
  - id: merge_inhalant_ige
    merge:
      select:
        any:
          - { name: "Inhalant_IgE" }
          - { name: "IgE (Inhalant)" }
      as: "Inhalant allergen sensitization (IgE)"

  - check: { assert: ledger_preserved }
  - check: { assert: name_unique }
