version: 1
description: "Stage 3: flatten Spirometry representation leaves; extract buffer-radius facets under built environment."

rules:
  - id: spirometry_absorb_units
    flatten:
      select:
        all:
          - { parent: "Spirometry" }
          - { children: ">0" }
      absorb:
        match: "^(?P<unit>Absolute|Z-score) \\("
      definition_suffix: "Measurement variants: {unit}."

  - id: spirometry_stray_absolute
    reroute:
      select: { name: "Absolute" }
      to: "Spirometry"
      keep_as_keyword: true

  - id: built_env_buffer_radii
    extract_facet:
      select: { parent: "Built environment/neighbourhood characteristics" }
      pattern: "^(?P<concept>.+?)(?P<buffer>\\d{3})$"
      group_by: concept
      name_template: "{concept}"
      definition_suffix: "Buffer radii (m): {buffer}."

  - check: { assert: ledger_preserved }
  - check: { assert: name_unique }
